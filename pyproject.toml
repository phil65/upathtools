#:tombi schema.strict = false

[project]
name = "upathtools"
version = "1.26.1"
description = "Async helpers, typed base classes and many filesystem implementations for fsspec and universal-pathlib"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Philipp Temminghoff", email = "philipptemminghoff@googlemail.com" },
]
keywords = [
  "async",
  "filesystem",
  "fsspec",
  "mcp",
  "pathlib",
  "sandbox",
  "sqlite",
  "universal-pathlib",
  "upath",
  "vfs",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Framework :: Pydantic :: 2",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Filesystems",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  # Only add below (Copier)
  "aiofile>=3.9.0",
  "fsspec>=2025.2.0",
  "pydantic>=2.10",  # upathtools_config, pydantic_type
  "ripgrep-rs>=0.3.14",
  "universal-pathlib>=0.3.0",
]

[project.urls]
"Code coverage" = "https://app.codecov.io/gh/phil65/upathtools"
Documentation = "https://phil65.github.io/upathtools/"
Homepage = "https://phil65.github.io/upathtools/"
Issues = "https://github.com/phil65/upathtools/issues"
Source = "https://github.com/phil65/upathtools"
"Spec: Agent Skills" = "https://agentskills.io/specification"
"Spec: Appwrite Storage" = "https://appwrite.io/docs/references/cloud/server-python/storage"
"Spec: GitHub REST" = "https://docs.github.com/en/rest"
"Spec: GitLab API" = "https://docs.gitlab.com/api/repository_files/"
"Spec: Linear GraphQL" = "https://linear.app/developers/graphql"
"Spec: MCP" = "https://modelcontextprotocol.io/specification/latest"
"Spec: Notion API" = "https://developers.notion.com/reference/intro"
"Spec: fsspec API" = "https://filesystem-spec.readthedocs.io/en/latest/api.html"

[project.entry-points."fsspec.specs"]
asynclocal = "upathtools.filesystems:AsyncLocalFileSystem"
gist = "upathtools.filesystems:GistFileSystem"
wiki = "upathtools.filesystems:WikiFileSystem"
markdown = "upathtools.filesystems:MarkdownFileSystem"
distribution = "upathtools.filesystems:DistributionFileSystem"
pkg = "upathtools.filesystems:PackageFileSystem"
notion = "upathtools.filesystems:NotionFileSystem"
appwrite = "upathtools.filesystems:AppwriteFileSystem"
flatunion = "upathtools.filesystems:FlatUnionFileSystem"
mcp = "upathtools.filesystems:MCPFileSystem"
mcptools = "upathtools.filesystems:MCPToolsFileSystem"
openapi = "upathtools.filesystems:OpenAPIFileSystem"
jsonschema = "upathtools.filesystems:JsonSchemaFileSystem"
basemodel = "upathtools.filesystems:BaseModelFileSystem"
basemodel-instance = "upathtools.filesystems:BaseModelInstanceFileSystem"
sqlite = "upathtools.filesystems:SqliteFileSystem"
ts = "upathtools.filesystems:TreeSitterFileSystem"
gitlab = "upathtools.filesystems:GitLabFileSystem"
linear = "upathtools.filesystems:LinearIssueFileSystem"
issues = "upathtools.filesystems:IssueFileSystem"
overlay = "upathtools.filesystems:OverlayFileSystem"
union = "upathtools.filesystems:UnionFileSystem"
httpx = "upathtools.filesystems:HTTPFileSystem"
beam = "upathtools.filesystems:BeamFS"
codex = "upathtools.filesystems:CodexFS"
daytona = "upathtools.filesystems:DaytonaFS"
e2b = "upathtools.filesystems:E2BFS"
modal = "upathtools.filesystems:ModalFS"
vercel = "upathtools.filesystems:VercelFS"
microsandbox = "upathtools.filesystems:MicrosandboxFS"
hopx = "upathtools.filesystems:HopXFS"
cloudflare = "upathtools.filesystems:CloudflareFS"
sprites = "upathtools.filesystems:SpritesFS"

[project.entry-points."jinjarope.environment"]
upathtools = "upathtools.filetree:setup_jinjarope_filters"

[project.entry-points."universal_pathlib.implementations"]
asynclocal = "upathtools.filesystems:LocalPath"
gist = "upathtools.filesystems:GistPath"
wiki = "upathtools.filesystems:WikiPath"
markdown = "upathtools.filesystems:MarkdownPath"
distribution = "upathtools.filesystems:DistributionPath"
pkg = "upathtools.filesystems:PackagePath"
notion = "upathtools.filesystems:NotionPath"
appwrite = "upathtools.filesystems:AppwritePath"
flatunion = "upathtools.filesystems:FlatUnionPath"
mcp = "upathtools.filesystems:MCPPath"
mcptools = "upathtools.filesystems:MCPToolsPath"
basemodel = "upathtools.filesystems:BaseModelPath"
basemodel-instance = "upathtools.filesystems:BaseModelInstancePath"
openapi = "upathtools.filesystems:OpenAPIPath"
jsonschema = "upathtools.filesystems:JsonSchemaPath"
sqlite = "upathtools.filesystems:SqlitePath"
ts = "upathtools.filesystems:TreeSitterPath"
gitlab = "upathtools.filesystems:GitLabPath"
linear = "upathtools.filesystems:LinearIssuePath"
issues = "upathtools.filesystems:IssuePath"
overlay = "upathtools.filesystems:OverlayPath"
union = "upathtools.filesystems:UnionPath"
httpx = "upathtools.filesystems:HttpPath"
beam = "upathtools.filesystems:BeamPath"
codex = "upathtools.filesystems:CodexPath"
daytona = "upathtools.filesystems:DaytonaPath"
e2b = "upathtools.filesystems:E2BPath"
modal = "upathtools.filesystems:ModalPath"
vercel = "upathtools.filesystems:VercelPath"
microsandbox = "upathtools.filesystems:MicrosandboxPath"
hopx = "upathtools.filesystems:HopXPath"
cloudflare = "upathtools.filesystems:CloudflarePath"
sprites = "upathtools.filesystems:SpritesPath"

[project.optional-dependencies]
adlfs = ["adlfs"]  # ADLS integration
# agentfs = [
#   "agentfs-sdk>=0.4.0rc17",
# ]
appwrite = ["appwrite>=16"]  # Appwrite integration (typed models since 16)
beam = ["beam-client>=0.2.187; sys_platform != 'win32' or python_version < '3.14'"]  # Beam integration
cloudflare = ["httpx2>=2.16"]  # Cloudflare Sandbox integration
codex = ["codexed"]  # Codex CLI integration
daytona = ["daytona<2; python_version < '3.14'"]  # Daytona integration
e2b = ["e2b-code-interpreter"]  # E2B integration
gcsfs = ["gcsfs"]  # GCS integration
gitlab = ["python-gitlab>=7.0.0"]  # GitLab integration
hopx = ["hopx-ai"]  # HopX integration
httpx = ["httpx2>=2.16", "yarl", "brotli"]  # httpx2 based filesystem (`httpx://` protocol)
httpx2 = ["httpx2>=2.16", "yarl", "brotli"]  # alias of the `httpx` extra
huggingface_hub = ["huggingface_hub"]  # HuggingFace integration
jq = ["jq>=1.8.0"]  # jq JSON processor
jsonschema = ["PyYAML", "requests"]  # JSON Schema integration
mcp = ["fastmcp", "mcp"]  # Virtual MCP Tools & MCP Resources filesystem
microsandbox = ["microsandbox; sys_platform != 'win32'"]  # Microsandbox integration
modal = ["modal"]  # Modal integration
monty = [
  "pydantic-monty>=0.0.5",
]
notion-client = ["notion-client"]  # Notion integration
openapi3 = ["openapi3"]  # OpenAPI integration
s3fs = ["s3fs"]  # S3 integration
sprites = ["httpx2>=2.16"]  # Sprites (Fly.io) integration
sqlite = ["sqlalchemy[aiosqlite]"]  # SQLite integration
srt = ["anyenv>=2.0.0"]  # Sandbox Runtime (srt) integration
ssh = [
  "sshfs[bcrypt]>=2025.11.0",
]
tree-sitter = [
  "tree-sitter>=0.25.2",
  "tree-sitter-python>=0.25.0",
  "tree-sitter-c>=0.24.1",
  "tree-sitter-javascript>=0.25.0",
  "tree-sitter>=0.25.2",
  "tree-sitter-typescript>=0.23.0",
  "tree-sitter-cpp>=0.23.0",
  "tree-sitter-rust>=0.23.0",
  "tree-sitter-go>=0.23.0",
  "tree-sitter-json>=0.24.0",
  "tree-sitter-yaml>=0.6.0",
]  # Tree-sitter based filesystem
vercel = ["vercel"]  # Vercel integration
webdav4 = ["webdav4"]  # WebDAV integration

[dependency-groups]
dev = [
  "deptry",
  "devtools",
  "pyreadline3",
  "pytest",
  # Only add below (Copier)
  "pytest-asyncio>=0.25.3",
  "pytest-cov",
]
benchmark = ["pyinstrument"]
docs = [
  "mkdocstrings[python]",
  "mknodes>=4.0.0",
  # Only add below (Copier)
  "pymdown-extensions",
  "zensical>=0.0.11",
]
lint = [
  # Only add below (Copier)
  "jinja2",  # type-only import (filetree jinja filters) for ty
  # Pinned on purpose: CI, pre-commit and editors all run exactly these versions.
  # Bump them here (template) and roll out via `copier update`.
  "ruff==0.17.6",
  "ty==0.0.110",
  "types-Authlib",
  "types-PyYAML",
  "types-Pygments",
  "types-jsonschema",
  "types-protobuf",
  "types-requests",
]

[build-system]
requires = ["uv_build>=0.8.22"]
build-backend = "uv_build"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError",
  'if __name__ == "__main__":',
]

[tool.deptry.per_rule_ignores]
# tree-sitter grammars are imported dynamically by name (treesitter_fs).
DEP002 = [
  "tree-sitter-c",
  "tree-sitter-cpp",
  "tree-sitter-go",
  "tree-sitter-javascript",
  "tree-sitter-json",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
  "tree-sitter-yaml",
]
# Modules shipped by declared distributions under another name
# (pydantic -> pydantic_core, beam-client -> beta9, e2b-code-interpreter -> e2b).
DEP003 = ["beta9", "e2b", "pydantic_core"]

[tool.mknodes]
allowed-commit-types = [
  "fix",
  "feat",
  "refactor",
  "docs",
  "test",
  "build",
  "chore",
]
docstring-style = "google"

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
pythonPlatform = "All"
typeCheckingMode = "basic"
deprecateTypingAliases = true
reportMissingTypeStubs = false
reportUnusedCallResult = false
reportUnknownVariableType = false
reportAny = false
reportImplicitOverride = false
reportUnusedFunction = false
reportImplicitStringConcatenation = false
reportIgnoreCommentWithoutRule = false
reportUnannotatedClassAttribute = false
reportSelfClsParameterName = false
reportPrivateImportUsage = false

[tool.pytest]
addopts = ["-m", "not integration"]
log_cli = true
log_date_format = "%Y-%m-%d %H:%M:%S"
log_format = "%(asctime)s %(levelname)s %(message)s"
markers = [
  "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
minversion = "9.0"
testpaths = ["tests/"]
asyncio_default_fixture_loop_scope = "session"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py314"

[tool.ruff.lint]
select = [
  "A",  # Flake8-builtins
  # "ANN",  # Flake8-Annotations
  # "ASYNC",  # Flake8-Async
  # "ARG",  # # Flake8-Unused-Arguments
  "B",  # flake8-bugbear
  "BLE",  # Flake8-blind-except
  "C",
  "C4",  # flake8-comprehensions
  # "C90",  # MCCabe
  "COM",  # Flake8-commas
  # "CPY",  #  Copyright-related rules
  "D",  # PyDocStyle
  # "DTZ",  # Flake8- Datetimez
  "E",  # PyCodeStyle Error
  "EM",  # flake8-errmsg
  # "ERA",  #  Eradicate
  "EXE",  # flake8-executable
  "F",  # PyFlakes
  # "FBT",  # flake8-boolean-trap
  # "FIX",  # flake8-fixme
  "FLY",  # flynt
  "G",  # flake8-logging-format
  "I",  # ISort
  "ICN",  # Flake8-import-conventions
  "INP",  # flake8-no-pep420
  "INT",  # flake8-gettext
  "ISC",  # flake8-implicit-str-concat
  "N",  # pep8-naming
  # "NPY",  # numpy-specific rules
  # "PD",   # pandas-vet
  "PERF",  # perflint
  # "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PLE",  # PyLint Error
  "PLC",  # PyLint convention
  # "PLW",  # PyLint Warning
  "PLR",  # PyLint refactor
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",  # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff-specific rules
  # "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "SLF",  # flake8-self
  "SLOT",  # flake8-slots
  # "T",
  # "TD",   # flake8-todos
  "T10",  # flake8-debugger
  # "T20",  # flake8-print
  "TC",  # flake8-type-checking
  "TID",  # flake8-tidy-imports
  "TRY",  # tryceratops
  "UP",  # PyUpgrade
  "W",  # PyCodeStyle warning
  "YTT",  # flake8-2020
]
ignore = [
  "C408",  # Unnecessary {obj_type} call (rewrite as a literal)
  "B905",  # zip() without an explicit strict= parameter
  "C901",  # {name} is too complex ({complexity} > {max_complexity})
  "COM812",
  # "CPY001", # Missing copyright notice at top of file
  "D100",  # Missing docstring in public module
  "D101",  # Missing docstring in public class
  "D102",  # Missing docstring in public method
  "D103",  # Missing docstring in public function
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D106",  # Missing docstring in public nested class
  "D107",  # Missing docstring in __init__
  "D203",  # 1 blank line required before class docstring
  "D204",  # 1 blank line required after class docstring
  "D213",  # Multi-line docstring summary should start at the second line
  "D215",  # Section underline is over-indented ("{name}")
  "D400",  # First line should end with a period
  "D401",  # First line of docstring should be in imperative mood: "{first_line}"
  "D404",  # First word of the docstring should not be "This"
  "D406",  # Section name should end with a newline ("{name}")
  "D407",  # Missing dashed underline after section ("{name}")
  "D408",  # Section underline should be in the line following the section's name ("{name}")
  "D409",  # Section underline should match the length of its name ("{name}")
  "D413",  # Missing blank line after last section ("{name}")
  "EM101",  # Exception must not use a string literal, assign to variable first
  "EM102",  # Exception must not use an f-string literal, assign to variable first
  "ISC001",
  "PLC0415",
  "PLR0912",  # Too many branches
  "PLR0913",  # Too many arguments to function call
  "PLR0917",  # Too many positional arguments
  "PLR0915",  # Too many statements
  # "PLR2004", # Magic values instead of named consts
  "SLF001",  # Private member accessed
  "TRY003",  # Avoid specifying long messages outside the exception class
  "TC006",  # runtime-cast-value
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"__future__.annotations" = { msg = "Not needed on Python 3.14 (PEP 649)." }

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
  "schemez.Schema",
  "sqlmodel.SQLModel",
]
runtime-evaluated-decorators = [
  "pydantic.validate_call",
  "fastapi.FastAPI.get",
  "fastapi.FastAPI.post",
  "fastmcp.FastMCP.tool",
  "typer.Typer.command",
]

[tool.ruff.lint.isort]
lines-after-imports = 2
# lines-between-types = 1
# atomic = true
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "I001"]
"scripts/*" = ["INP001"]
"*tests/*" = ["D100"]

[tool.ruff.format]
preview = true

[tool.ty.analysis]
# Platform/version-gated extras (beam-client provides beam and beta9; it and
# microsandbox are not installed on Windows; daytona: < 3.14) and jq (no wheels
# everywhere). Still type-checked wherever installed.
allowed-unresolved-imports = ["beam.**", "beta9.**", "daytona.**", "jq.**", "microsandbox.**"]

[tool.ty.rules]
# Narrowing an overridden class attribute (e.g. pydantic discriminators,
# `Config` attributes, fsspec `protocol`) is an intentional pattern.
incompatible-mutable-override = "ignore"
# fsspec's (untyped) base signatures are inconsistent across its own
# implementations; the filesystems here follow the concrete backends.
# (attribute-override: the same for methods assigned via sync_wrapper/wrap_method)
incompatible-attribute-override = "ignore"
incompatible-method-override = "ignore"
possibly-missing-import = "warn"
division-by-zero = "warn"

[tool.ty.src]
# `ty check` (hooks, CI, editors) type-checks the package code only.
include = ["src"]

[tool.ty.environment]
python-version = "3.14"
python-platform = "all"

[tool.uv]
default-groups = ["dev", "lint", "docs"]
override-dependencies = [
  "logfire>=4.0.0",
  # "agentpool>=1.15.0",
  "protobuf>=5.0.0"
]  # required bc of beam

[tool.uv.build-backend]
module-name = [
  "upathtools",
  "upathtools_config",
]
wheel-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
source-exclude = [
  ".mypy_cache/**",
  "__pycache__/**",
  "*.pyc",
  "*.pyo",
  ".pytest_cache/**",
  ".ruff_cache/**",
]
